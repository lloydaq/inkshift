<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eee6" />
    <title>Inkshift browser fixture</title>
    <script type="module">
      // The first-paint script, generated by the built package, runs before the body.
      import { createInitScript } from '/dist/index.js';
      window.__initScript = createInitScript({ storageKey: 'fx' });
    </script>
    <link rel="stylesheet" href="/dist/styles.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: var(--inkshift-background); color: var(--inkshift-foreground); font: 16px system-ui; }
      #toggle { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; }
      #light { position: fixed; top: 20px; left: 20px; }
    </style>
  </head>
  <body>
    <button id="toggle" data-inkshift-toggle>Toggle</button>
    <button id="light">Light</button>
    <script type="module">
      import { createThemeController } from '/dist/index.js';
      const ends = [];
      const theme = createThemeController({
        storageKey: 'fx',
        animation: { seed: 11 },
        onTransitionEnd: (info) => ends.push(info),
      });
      document.getElementById('toggle').addEventListener('click', (event) => theme.toggleTheme(event));
      document.getElementById('light').addEventListener('click', (event) => theme.setTheme('light', event));
      Object.assign(window, { theme, ends });
      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
